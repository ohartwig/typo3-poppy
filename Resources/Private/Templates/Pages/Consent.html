Direct Sign-In consent. Keep the POST to {action} with _token, approve and
scopes[] when replacing it. The agent's name and logo are its own claims; the
host its metadata is published on is what was checked, and is always shown.
-->
<f:layout name="Page" />
<f:section name="Title"><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.title" /></f:section>
<f:section name="Main">
    <h1><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.title" /></h1>
    <f:render partial="Agent" arguments="{agent: agent, agentHost: agentHost}" />
    <p><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.intro" arguments="{0: company.name, 1: userName}" /></p>
    <form method="post" action="{action}">
        <input type="hidden" name="_token" value="{token}">
        <f:render partial="Scopes" arguments="{scopes: scopes}" />
        <p class="muted"><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.returnTo" arguments="{0: redirectHost}" /></p>
        <p class="muted"><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.revokeHint" /></p>
        <div class="actions">
            <button type="submit" name="approve" value="1" class="primary"><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.approve" /></button>
            <button type="submit" name="approve" value="0"><f:translate key="LLL:EXT:koh_poppy/Resources/Private/Language/locallang.xlf:consent.deny" /></button>
        </div>
    </form>
</f:section>
